<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>My Toolbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: sans-serif;
      background: #000;
      color: #fff;
      font-size: 13px;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 4px;
    }
    h1 {
      font-size: 13px;
      text-align: center;
      margin-bottom: 3px;
      flex: 0 0 auto;
    }
    .status {
      font-size: 10px;
      color: #8c8;
      min-height: 12px;
      text-align: center;
      flex: 0 0 auto;
      margin-bottom: 3px;
      padding: 0 2px;
      line-height: 1.1;
    }
    .status.error { color: #f66; }
    .panel {
      display: none;
      flex: 1 1 auto;
      overflow-y: auto;
      flex-direction: column;
    }
    .panel.active { display: flex; }
    .btn {
      display: block;
      width: 100%;
      padding: 6px 8px;
      margin: 2px 0;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 3px;
      font-size: 12px;
      text-align: center;
    }
    .btn:focus {
      background: #4a7;
      border-color: #6c9;
      outline: 2px solid #fff;
    }
    .btn:active { background: #4a7; }
    .stop { background: #a22; }
    .stop:focus { background: #d33; outline: 2px solid #fff; }
    #recorder-panel .status {
      color: #f44;
      font-weight: bold;
      margin: 6px 0;
      font-size: 12px;
      min-height: 20px;
    }
  </style>
</head>
<body>

<h1>Toolbox</h1>
<div class="status" id="menu-status"></div>

<!-- MAIN MENU -->
<div id="menu-panel" class="panel active">
  <button class="btn" id="btn-record" tabindex="0">Record</button>
  <button class="btn" id="btn-alarms" tabindex="0">Alarms</button>
  <button class="btn" id="btn-hotspot" tabindex="0">Hotspot / Tethering</button>
  <button class="btn" id="btn-transcribe" tabindex="0">Transcribe site</button>
  <button class="btn" id="btn-settings" tabindex="0">Device settings</button>
</div>

<!-- RECORDER -->
<div id="recorder-panel" class="panel">
  <div class="status" id="rec-status">Recording… tap center to stop</div>
  <button class="btn stop" id="btn-stop" tabindex="0">Stop &amp; Save</button>
  <button class="btn" id="btn-back" tabindex="0">Back (discards)</button>
</div>

<script src="app.js"></script>
</body>
</html>
